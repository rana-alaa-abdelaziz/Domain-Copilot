# Golden evaluation set for FR-3.
#
# SCOPE NOTE (read before adding/editing entries): this set evaluates the
# HybridRetrieveUseCase directly — there is no answer-generation/agent
# step wired in yet, so "groundedness" here is a retrieval-level proxy
# (does the top-ranked chunk actually contain the expected content),
# not a check on a generated answer's claims against its citations. Once
# an answer-generation use case exists, add a second pass that checks the
# generated answer's text against these same expected_keywords, and keep
# this retrieval-level check as a fast lower-layer signal.
#
# Similarly, the prompt_injection entries below test that a malicious
# QUERY doesn't break retrieval or return spurious results. They do NOT
# yet test the more important INDIRECT case (a malicious instruction
# embedded inside a retrieved document's content being obeyed by a
# generation step) — that requires the generation step to exist and must
# be added to this set once it does. Flagging this explicitly rather than
# silently claiming full injection coverage.
#
# Fields:
#   id                  - unique, stable identifier (don't renumber on edit)
#   category            - "standard" or "adversarial"
#   adversarial_type    - null for standard; one of out_of_corpus,
#                         ambiguous, prompt_injection, conflicting_sources
#   question            - the query sent to HybridRetrieveUseCase
#   expected_answerable - true if the corpus should yield a good answer
#   expected_keywords   - substrings the harness checks for in retrieved
#                         chunk content (case-insensitive). Only used when
#                         expected_answerable is true.
#   source_doc          - which corpus doc this targets, for human
#                         reference only (not matched by the harness,
#                         since doc_id is a runtime UUID)
#   notes               - why this case is included / what it stresses

