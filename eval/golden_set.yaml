- id: q25
  category: adversarial
  adversarial_type: conflicting_sources
  question: "How long does it take a junior developer to reach proficiency?"
  expected_answerable: false
  expected_keywords: []
  source_doc: "rubric_coding_proficiency, rubric_database_design_competency"
  notes: "Genuinely conflicting timeframes exist across the corpus: rubric_coding_proficiency.md states growth toward Level 3 is expected 'within the first year', while rubric_database_design_competency.md states the proficient level is expected 'within twelve to eighteen months' for a different (but related) competency. A good system should surface both and flag the discrepancy rather than confidently stating one figure as if it were the only answer. At the retrieval-only stage this harness can only confirm chunks from BOTH sources are retrievable (see eval script's separate conflicting-sources check) — actually flagging the conflict requires a generation step."
